name: bug report
description: something broke or acts wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: thanks for reporting. the more exact the steps, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: what happened
      description: what you did, what you expected, what you got instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: steps to reproduce
      placeholder: |
        1. press the hotkey
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: da transcribuh version
      description: Settings > General shows it
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Air M2
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: speech engine
      options:
        - built-in (WhisperKit)
        - custom WhisperKit model
        - OpenAI-compatible server
        - not sure
  - type: textarea
    id: logs
    attributes:
      label: logs or diagnostics
      description: optional. a diagnostics export, console output or a screen recording. remove anything private first
